name: REAL5 one-shot

on:
  push:
    paths:
      - ".github/workflows/real5-once.yml"
      - "experiments/real5_spectrum_quartets.py"
      - "src/outotesti/geometry.py"

jobs:
  real5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install OutoTesti model dependencies
        run: python -m pip install -e . transformers
      - name: Run REAL5
        run: python experiments/real5_spectrum_quartets.py --model roneneldan/TinyStories-1M --controls 32 --splits 4 --quartets 4096 --init-seed 20260902
      - uses: actions/upload-artifact@v4
        with:
          name: outotesti-real5
          path: results/real5/
