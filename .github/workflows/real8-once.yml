name: REAL8 one-shot

on:
  push:
    paths:
      - ".github/workflows/real8-once.yml"
      - "experiments/real8_replication_instruct.py"
      - "experiments/real7_head_subspace_hierarchy.py"
      - "src/outotesti/subspace.py"

jobs:
  real8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install OutoTesti model dependencies
        run: python -m pip install -e . transformers
      - name: Run REAL8 replication
        run: python experiments/real8_replication_instruct.py --model roneneldan/TinyStories-Instruct-1M --controls 128 --init-seed 20260903
      - uses: actions/upload-artifact@v4
        with:
          name: outotesti-real8
          path: results/real8/
