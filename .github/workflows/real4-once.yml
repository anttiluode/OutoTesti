name: REAL4 one-shot

on:
  push:
    paths:
      - ".github/workflows/real4-once.yml"
      - "experiments/real4_head_score_operator.py"
      - "src/outotesti/stability.py"
      - "src/outotesti/green.py"
      - "src/outotesti/geometry.py"

jobs:
  real4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install OutoTesti model dependencies
        run: python -m pip install -e . transformers
      - name: Run REAL4
        run: python experiments/real4_head_score_operator.py --model roneneldan/TinyStories-1M --geometry-controls 32 --split-controls 4 --green-controls 2 --init-seed 20260902
      - uses: actions/upload-artifact@v4
        with:
          name: outotesti-real4
          path: results/real4/
