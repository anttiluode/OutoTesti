name: REAL6 one-shot

on:
  push:
    paths:
      - ".github/workflows/real6-once.yml"
      - "experiments/real6_qk_gauge_attack.py"
      - "src/outotesti/gauge.py"
      - "src/outotesti/geometry.py"

jobs:
  real6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install OutoTesti model dependencies
        run: python -m pip install -e . transformers
      - name: Run REAL6
        run: python experiments/real6_qk_gauge_attack.py --model roneneldan/TinyStories-1M --gauges 16 --controls 64 --quartets 4096 --seed 20260903
      - uses: actions/upload-artifact@v4
        with:
          name: outotesti-real6
          path: results/real6/
