name: REAL2 one-shot

on:
  push:
    paths:
      - ".github/workflows/real2-once.yml"
      - "experiments/real2_geometry_green.py"
      - "src/outotesti/geometry.py"
      - "src/outotesti/green.py"
      - "src/outotesti/projection.py"

jobs:
  real2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install OutoTesti model dependencies
        run: python -m pip install -e . transformers
      - name: Run REAL2
        run: python experiments/real2_geometry_green.py --model roneneldan/TinyStories-1M --geometry-controls 64 --green-random-trees 4 --quartets 4096
      - uses: actions/upload-artifact@v4
        with:
          name: outotesti-real2
          path: results/real2/
