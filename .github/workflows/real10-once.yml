name: REAL10 one-shot

on:
  push:
    paths:
      - ".github/workflows/real10-once.yml"
      - "experiments/real10_behavior_prediction.py"
      - "src/outotesti/behavior.py"
      - "src/outotesti/subspace.py"

jobs:
  real10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install OutoTesti model dependencies
        run: python -m pip install -e . transformers
      - name: Run REAL10 behavioral validation
        run: python experiments/real10_behavior_prediction.py --permutation-controls 512 --init-seed 20260903
      - uses: actions/upload-artifact@v4
        with:
          name: outotesti-real10
          path: results/real10/
