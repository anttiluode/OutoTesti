name: REAL3 one-shot

on:
  push:
    paths:
      - ".github/workflows/real3-once.yml"
      - "experiments/real3_qk_transfer.py"
      - "src/outotesti/green.py"
      - "src/outotesti/geometry.py"

jobs:
  real3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install OutoTesti model dependencies
        run: python -m pip install -e . transformers
      - name: Run REAL3
        run: python experiments/real3_qk_transfer.py --model roneneldan/TinyStories-1M --controls 4 --geometry-controls 32 --init-seed 20260902
      - uses: actions/upload-artifact@v4
        with:
          name: outotesti-real3
          path: results/real3/
