name: CI

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: pytest -q
      - run: python experiments/sanity.py


  tinystories-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[models]
      - name: Audit TinyStories-1M trained projections
        run: python experiments/audit_tinystories.py --model roneneldan/TinyStories-1M --device cpu --random-trees 4 --behavior
      - uses: actions/upload-artifact@v4
        with:
          name: tinystories-1m-audit
          path: results/tinystories_1m/
